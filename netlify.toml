# Netlify yapılandırması — Next.js (App Router)
# Resmi Next.js Runtime eklentisi App Router, SSR, dinamik route'lar ve
# Image Optimization'ı otomatik yönetir.

[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Node sürümü: proje React 19 + Next 15 kullanıyor, bu yüzden Node 20 öneriliyor.
[build.environment]
  NODE_VERSION = "20"
  # R2_BUCKET_NAME is a non-sensitive bucket identifier (not a credential).
  # Exempt it from secrets scanning so the build doesn't get blocked.
  SECRETS_SCAN_OMIT_KEYS = "R2_BUCKET_NAME"
